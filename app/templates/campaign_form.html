{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Neue Nivellement-Kampagne</h1><form method="post" action="/campaigns" class="grid-form"><label class="wide">Datum<input type="datetime-local" name="measured_at" value="{{now}}" required></label><label>Lufttemperatur °C<input type="number" step="0.1" name="air_temp"></label><label>Wandtemperatur SW<input type="number" step="0.1" name="wall_temp_sw"></label><label>Wandtemperatur SO<input type="number" step="0.1" name="wall_temp_so"></label><label>Grundwasser m u. GOK<input type="number" step="0.001" name="groundwater"></label><label>Wetter<input name="weather"></label><label>Lichtquelle<input name="light_mode"></label><label class="wide">Notiz<textarea name="notes"></textarea></label><button class="wide">Weiter</button></form></section>{% endblock %}
