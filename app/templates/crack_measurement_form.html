{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Messung: {{point.name}}</h1><form method="post" action="/cracks/{{point.id}}/measurements" enctype="multipart/form-data" class="grid-form"><label class="wide">Datum und Uhrzeit<input name="measured_at" type="datetime-local" value="{{now}}" required></label><label>Lufttemperatur °C<input name="air_temp" type="number" step="0.1"></label><label>Messwert mm<input name="value" type="number" step="0.001" required inputmode="decimal"></label><label class="wide">Foto<input name="photo" type="file" accept="image/*" capture="environment"></label><label class="wide">Notiz<textarea name="notes" rows="3"></textarea></label><button class="wide">Messung speichern</button></form></section>{% endblock %}
